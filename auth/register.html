<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AURA</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

    <main class="main-content">
        <div class="form-content">
            <a class="back-to-home" href="/index.html"> < Regresar a Inicio.</a>
            <h1>Registrarse en <a href="/index.html" style="text-decoration: none;">AURA</a></h1>
            <form>
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required>
                
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
                
                <label for="" class="label-slim">¿Ya tienes cuenta? <a href="/auth/login.html">Inicia Sesión.</a></label>

                <div class="validation-terms">
                    <label for="terms" class="label-slim">Acepto los terminos y condiciones</label>
                    <input type="checkbox" id="terms" name="terms" required>
                </div>
                
                <button type="submit" class="btn-disabled" disabled>Registrarse</button>
            </form>
            <div class="alert">
            </div>
        </div>
    </main>
    
    <script src="../js/authentication.js" type="module"></script>
</body>
</html>
